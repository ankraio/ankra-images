name: actions-runner image

# Builds the ARC runner image used by the ankra-infrastructure
# `arc-runner-set` scale set. See actions-runner/Dockerfile for why the image
# exists at all (ankra-n2cs1).
#
# The weekly rebuild is deliberate: the image carries apt packages, so a tag
# that is never rebuilt accumulates unpatched CVEs. Each rebuild publishes a
# NEW immutable tag; nothing that is already deployed changes until someone
# repins arc-runner-set values.yaml, so a rebuild can never move a running
# scale set underneath us.

on:
  push:
    branches: [master]
    paths:
      - 'actions-runner/**'
      - '.github/workflows/actions-runner.yml'
  pull_request:
    paths:
      - 'actions-runner/**'
      - '.github/workflows/actions-runner.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish
    runs-on: ${{ vars.CI_RUNNER_2 || 'depot-ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        run: |
          set -euo pipefail
          RUNNER_VERSION=$(grep -m1 '^ARG RUNNER_VERSION=' actions-runner/Dockerfile | cut -d= -f2)
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER}/actions-runner
          SHORT=${GITHUB_SHA::7}
          # The immutable tag is the one arc-runner-set values.yaml pins.
          echo "immutable=${IMAGE}:${RUNNER_VERSION}-${SHORT}" >> "$GITHUB_OUTPUT"
          TAGS="${IMAGE}:${RUNNER_VERSION}-${SHORT}"
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            TAGS="${TAGS},${IMAGE}:${RUNNER_VERSION},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "runner_version=${RUNNER_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: actions-runner
          file: actions-runner/Dockerfile
          # Pull requests build but do not publish, so a Dockerfile change is
          # proven to build (including the toolchain self-test in the final
          # layer) before it can reach a tag.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The scale set pulls this image by tag from a plain containerd; the
          # attestation manifests buildx attaches by default are noise there,
          # and Harbor (where sibling Ankra images live) rejects them outright.
          provenance: false
          sbom: false

      - name: Summary
        run: |
          {
            echo "### actions-runner"
            echo
            echo "Base runner version: \`${{ steps.tags.outputs.runner_version }}\`"
            echo
            echo "Pin this in \`arc-runner-set\` values.yaml:"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.immutable }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
